<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 96">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a7046"/>
      <stop offset="0.4" stop-color="#c49a68"/>
      <stop offset="1" stop-color="#7e5a34"/>
    </linearGradient>
    <clipPath id="inside"><path d="M13.2 12L18.8 12L18.8 24.5C18.8 30 25.8 32 25.8 38.5L25.8 87.5C25.8 90.3 24.5 91.8 22 91.8L10 91.8C7.5 91.8 6.2 90.3 6.2 87.5L6.2 38.5C6.2 32 13.2 30 13.2 24.5Z"/></clipPath>
  </defs>
  <!-- what is in it, plain to see: its colour, and its level (the fill variable, 0 to 1) -->
  <g clip-path="url(#inside)">
    <g style="transform: translateY(calc((1 - var(--fill)) * 75px))">
      <rect x="0" y="19" width="32" height="78" fill="#8fbfd6" style="fill: var(--liquid, #8fbfd6); opacity: var(--liquid-o, 0.4)"/>
      <rect x="0" y="19" width="32" height="78" fill="url(#body)" style="opacity: calc(var(--liquid-o, 0.4) + 0.2)"/>
      <ellipse cx="16" cy="19" rx="10.5" ry="1.6" fill="#ffffff" opacity="0.3" style="opacity: calc(var(--liquid-o, 0.4) * 0.4 + 0.1)"/>
      <path d="M6 19.6Q16 21.6 26 19.6" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.6" style="opacity: calc(var(--liquid-o, 0.4) + 0.3)"/>
    </g>
  </g>
  <!-- clear glass: barely there, a light edge, thicker at the bottom -->
  <path d="M12 10L20 10L20 24C20 29 27 31 27 38L27 88C27 91 25.5 93 22.5 93L9.5 93C6.5 93 5 91 5 88L5 38C5 31 12 29 12 24Z" fill="#d6e6ec" fill-opacity="0.1" stroke="#b9cfd6" stroke-opacity="0.8" stroke-width="1.1"/>
  <path d="M6.5 89.5Q16 92 25.5 89.5" fill="none" stroke="#d6e6ec" stroke-opacity="0.6" stroke-width="1.6"/>
  <rect x="11" y="9.5" width="10" height="3" rx="1" fill="#d6e6ec" fill-opacity="0.25" stroke="#b9cfd6" stroke-opacity="0.9" stroke-width="0.8"/>
  <rect x="12" y="2.5" width="8" height="11" rx="1.5" fill="url(#cork)" stroke="#4e3420" stroke-width="0.7"/>
  <ellipse cx="16" cy="2.9" rx="4" ry="0.9" fill="#d4ae7e"/>
  <g fill="#6e4c2a" opacity="0.6"><circle cx="14" cy="6" r="0.5"/><circle cx="17.5" cy="8" r="0.6"/><circle cx="15" cy="10.5" r="0.5"/><circle cx="18.2" cy="4.8" r="0.4"/></g>
  <!-- light on the glass, over whatever is in it -->
  <path d="M8.3 41L8.3 86" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M7.5 36C8.6 33 11 31 13 30" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M24.4 42L24.4 84" stroke="#8aa4ad" stroke-opacity="0.45" stroke-width="0.8"/>
  <path d="M13.8 15L13.8 24" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.9" stroke-linecap="round"/>
</svg>

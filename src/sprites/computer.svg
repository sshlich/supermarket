<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2cab4"/>
      <stop offset="0.6" stop-color="#bdb59e"/>
      <stop offset="1" stop-color="#a39a83"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <!-- an all-in-one terminal: a CRT in a beige case, a drive under the screen; the screen, its text and the light turn on with its power -->
  <rect x="6" y="4" width="84" height="88" rx="7" fill="url(#case)" stroke="#5a5444" stroke-width="1.2"/>
  <path d="M84 8C87 10 88.5 13 88.5 17L88.5 84C88.5 87 87 89.5 84 90.5" fill="none" stroke="#8f8670" stroke-width="2" opacity="0.6"/>
  <path d="M10 8.5C12 6.5 14 6 17 6L80 6" fill="none" stroke="#ece6d4" stroke-width="1.2" opacity="0.8"/>
  <rect x="15" y="11" width="66" height="48" rx="6" fill="#8f8873" stroke="#6b6452" stroke-width="0.8"/>
  <rect x="19.5" y="15" width="57" height="40" rx="9" fill="#1b201e" stroke="#111311" stroke-width="1"/>
  <defs><clipPath id="text"><rect x="23" y="18.5" width="50" height="31.5"/></clipPath></defs>
  <!-- the screen's text, when it is on: lines that step up one at a time while the bottom one types itself out (style.css,
       "pc-scroll" and "pc-type", on the page's one clock so a redraw or a drag does not restart them) -->
  <g clip-path="url(#text)">
    <g class="pc-scroll" fill="#1b201f"><rect x="25" y="20" width="22" height="1.8"/><rect x="25" y="25" width="34" height="1.8"/><rect x="25" y="30" width="16" height="1.8"/><rect x="25" y="35" width="28" height="1.8"/><rect x="25" y="40" width="40" height="1.8"/><rect x="25" y="45" width="12" height="1.8"/><rect x="25" y="50" width="30" height="1.8"/><rect x="25" y="55" width="20" height="1.8"/><rect x="25" y="60" width="22" height="1.8"/><rect x="25" y="65" width="34" height="1.8"/><rect x="25" y="70" width="16" height="1.8"/><rect x="25" y="75" width="28" height="1.8"/><rect x="25" y="80" width="40" height="1.8"/><rect x="25" y="85" width="12" height="1.8"/></g>
    <g class="pc-type"><rect x="24" y="44.5" width="49" height="2.8" fill="#1b201e"/><rect x="24.6" y="44.6" width="1.6" height="2.4" fill="#1b201f"/></g>
  </g>
  <rect x="19.5" y="15" width="57" height="40" rx="9" fill="url(#glow)"/>
  <path d="M24 19C29 17 38 16.5 46 17" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.18"/>
  <!-- the drive: a slot, and the edge of a disc in it when there is one -->
  <rect x="50" y="68" width="27" height="5" rx="1.2" fill="#6b6452"/>
  <rect x="52" y="69.6" width="23" height="1.8" rx="0.6" fill="#2a2822"/>
  <rect x="55" y="68.2" width="17" height="2" rx="0.4" fill="#3a3d44" style="opacity: var(--in0, 1)"/>
  <circle cx="23" cy="73" r="3.6" fill="#c9c1aa" stroke="#5a5444" stroke-width="0.8"/>
  <path d="M23 71.2V73.4M21.4 72A2.1 2.1 0 1 0 24.6 72" fill="none" stroke="#5a5444" stroke-width="0.7" stroke-linecap="round"/>
  <circle cx="31" cy="73" r="1.6" fill="#3b3a30"/>
  <g stroke="#8a826c" stroke-width="1.1" stroke-linecap="round"><path d="M14 82H44"/><path d="M14 85.5H44"/><path d="M14 89H44"/></g>
  <rect x="62" y="80" width="18" height="6" rx="1" fill="#a39a83" stroke="#6b6452" stroke-width="0.6"/>
</svg>

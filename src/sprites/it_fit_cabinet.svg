<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7aeb5"/>
      <stop offset="1" stop-color="#7d848b"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="0.3" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <!-- the roller grate: steel links in a brick pattern, the dark inside showing through -->
    <pattern id="grate" width="10" height="12" patternUnits="userSpaceOnUse" x="13" y="20">
      <rect width="10" height="2.2" fill="#aab1b7"/>
      <rect y="6" width="10" height="2.2" fill="#aab1b7"/>
      <rect y="2.2" width="2" height="3.8" fill="#8f969c"/>
      <rect x="5" y="8.2" width="2" height="3.8" fill="#8f969c"/>
    </pattern>
  </defs>
  <!-- seen straight from the front -->
  <g fill="#24282c"><rect x="9" y="90" width="8" height="5"/><rect x="79" y="90" width="8" height="5"/></g>
  <rect x="4" y="3" width="88" height="88" rx="2" fill="url(#steel)" stroke="#2c3035" stroke-width="1.2"/>
  <path d="M6 88.5L6 5L89.5 5" fill="none" stroke="#dfe3e6" stroke-opacity="0.55" stroke-width="1"/>
  <path d="M6 89L90 89L90 5.5" fill="none" stroke="#3a3f44" stroke-opacity="0.6" stroke-width="1"/>
  <!-- the box the grate rolls into, the guide rails, the grate, its bottom rail and the ring pull -->
  <rect x="9" y="9" width="78" height="11" rx="1" fill="#b2b9bf" stroke="#3a3f44" stroke-width="0.8"/>
  <path d="M10 17.5L86 17.5" stroke="#6b7278" stroke-width="0.8"/>
  <path d="M10 10.5L86 10.5" stroke="#e1e5e8" stroke-opacity="0.6" stroke-width="0.8"/>
  <rect x="13" y="20" width="70" height="58" fill="#1d2125"/>
  <rect x="13" y="20" width="70" height="58" fill="url(#grate)"/>
  <rect x="13" y="20" width="70" height="58" fill="url(#dark)"/>
  <g fill="#8a9197" stroke="#3a3f44" stroke-width="0.7"><rect x="9.5" y="20" width="3.5" height="63"/><rect x="83" y="20" width="3.5" height="63"/></g>
  <rect x="12" y="77" width="72" height="6" rx="1" fill="#949ba1" stroke="#3a3f44" stroke-width="0.8"/>
  <path d="M13 78.3L83 78.3" stroke="#e1e5e8" stroke-opacity="0.5" stroke-width="0.7"/>
  <circle cx="48" cy="80" r="2.2" fill="#3a3f44"/>
  <circle cx="48" cy="84.6" r="4.6" fill="none" stroke="#d4d8dc" stroke-width="1.8"/>
  <path d="M44.8 82.2C45.8 81 46.9 80.6 48 80.6" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>
  <g fill="#c6ccd1"><circle cx="7.5" cy="6.5" r="0.9"/><circle cx="88.5" cy="6.5" r="0.9"/><circle cx="7.5" cy="87.5" r="0.9"/><circle cx="88.5" cy="87.5" r="0.9"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 32">
  <defs>
    <linearGradient id="bm-top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4cbd1"/><stop offset="0.5" stop-color="#aab3ba"/><stop offset="1" stop-color="#97a0a8"/></linearGradient>
    <linearGradient id="bm-tf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a1a9b0"/><stop offset="0.35" stop-color="#868f97"/><stop offset="1" stop-color="#6a737a"/></linearGradient>
    <linearGradient id="bm-web" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e454b"/><stop offset="0.3" stop-color="#5c656c"/><stop offset="1" stop-color="#79828a"/></linearGradient>
    <linearGradient id="bm-bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8c0c6"/><stop offset="1" stop-color="#9aa3aa"/></linearGradient>
    <linearGradient id="bm-bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a838a"/><stop offset="0.5" stop-color="#626b72"/><stop offset="1" stop-color="#4c545a"/></linearGradient>
    <linearGradient id="bm-end" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d2d6d9"/><stop offset="1" stop-color="#9ea4a9"/></linearGradient>
    <linearGradient id="bm-glint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- a rolled I-beam lying along its length, seen from above and the front-left: a lit top flange, the recessed web in the
       shade of it with four bolt holes and a white stencil, the bottom flange catching light on its top, the sawn bare-steel end
       at the left, a yellow mill mark at the far end and rust weeping from the holes -->
  <path d="M10 28.2H127.4L124 31H12Z" fill="#0e0b13" opacity="0.3"/>
  <!-- web (recessed) -->
  <path d="M9.1 10.9L123.1 10.9L123.1 22.5L9.1 22.5Z" fill="url(#bm-web)"/>
  <!-- bottom flange: lit top strip, front face -->
  <path d="M11.5 24.3L125.5 24.3L123.1 22.5L9.1 22.5Z" fill="url(#bm-bt)"/>
  <path d="M11.5 24.3L125.5 24.3L125.5 28L11.5 28Z" fill="url(#bm-bf)"/>
  <!-- top flange: front face and top surface -->
  <path d="M11.5 9L125.5 9L125.5 12.7L11.5 12.7Z" fill="url(#bm-tf)"/>
  <path d="M11.5 9L125.5 9L118.5 3.8L4.5 3.8Z" fill="url(#bm-top)"/>
  <!-- left end: bare sawn steel -->
  <path d="M11.5 28L4.5 22.8L4.5 19.1L6.9 20.9L6.9 9.3L4.5 7.5L4.5 3.8L11.5 9L11.5 12.7L9.1 10.9L9.1 22.5L11.5 24.3Z" fill="url(#bm-end)"/>
  <!-- ======= details ======= -->
  <!-- stencil and holes on the web -->
  <path fill="#e8e6df" opacity="0.8" d="M17.5 15.2h2.4v0.8h-2.4zM20.7 15.2h1.6v0.8h-1.6zM27.1 15.2h0.8v2.4h-0.8zM28.7 15.2h0.8v4h-0.8zM18.3 16h0.8v3.2h-0.8zM20.7 16h0.8v3.2h-0.8zM22.3 16h0.8v0.8h-0.8zM21.5 16.8h0.8v0.8h-0.8zM23.9 16.8h2.4v0.8h-2.4zM27.9 16.8h0.8v0.8h-0.8zM22.3 17.6h0.8v0.8h-0.8zM17.5 18.4h0.8v0.8h-0.8zM19.1 18.4h0.8v0.8h-0.8zM21.5 18.4h0.8v0.8h-0.8z"/>
  <ellipse cx="41.6" cy="18.8" rx="3" ry="2.7" fill="#8e979e" opacity="0.45"/><ellipse cx="41.6" cy="18.8" rx="2.4" ry="2.2" fill="#262a2e"/><path d="M39.7 20.1Q41.6 22.1 43.6 19.9" fill="none" stroke="#b9c1c7" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/><path d="M39.4 18Q40.3 16.7 42.2 16.5" fill="none" stroke="#1a1d20" stroke-width="0.7" opacity="0.8"/>
  <ellipse cx="60.6" cy="18.8" rx="3" ry="2.7" fill="#8e979e" opacity="0.45"/><ellipse cx="60.6" cy="18.8" rx="2.4" ry="2.2" fill="#262a2e"/><path d="M58.7 20.1Q60.6 22.1 62.6 19.9" fill="none" stroke="#b9c1c7" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/><path d="M58.4 18Q59.3 16.7 61.2 16.5" fill="none" stroke="#1a1d20" stroke-width="0.7" opacity="0.8"/>
  <ellipse cx="79.6" cy="18.8" rx="3" ry="2.7" fill="#8e979e" opacity="0.45"/><ellipse cx="79.6" cy="18.8" rx="2.4" ry="2.2" fill="#262a2e"/><path d="M77.7 20.1Q79.6 22.1 81.6 19.9" fill="none" stroke="#b9c1c7" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/><path d="M77.4 18Q78.3 16.7 80.2 16.5" fill="none" stroke="#1a1d20" stroke-width="0.7" opacity="0.8"/>
  <ellipse cx="98.6" cy="18.8" rx="3" ry="2.7" fill="#8e979e" opacity="0.45"/><ellipse cx="98.6" cy="18.8" rx="2.4" ry="2.2" fill="#262a2e"/><path d="M96.7 20.1Q98.6 22.1 100.6 19.9" fill="none" stroke="#b9c1c7" stroke-width="0.7" stroke-linecap="round" opacity="0.7"/><path d="M96.4 18Q97.3 16.7 99.2 16.5" fill="none" stroke="#1a1d20" stroke-width="0.7" opacity="0.8"/>
  <path d="M60 21.4L60.2 26.6M97.39999999999999 21.6L97.5 25.2" stroke="#a4522b" stroke-width="0.9" opacity="0.55" stroke-linecap="round"/>
  <!-- yellow mill mark near the far end -->
  <path d="M110 9L114 9L107 3.8L103 3.8Z" fill="#d9b24a" opacity="0.9"/>
  <path d="M110 9L114 9L114 12.7L110 12.7Z" fill="#d9b24a" opacity="0.9"/>
  <path d="M115.2 9L116.6 9L109.6 3.8L108.2 3.8Z" fill="#4a78b8" opacity="0.9"/>
  <path d="M115.2 9L116.6 9L116.6 12.7L115.2 12.7Z" fill="#4a78b8" opacity="0.9"/>
  <!-- lit edges -->
  <path d="M12 9.6H125" stroke="#f1f5f7" stroke-width="0.8" opacity="0.8" stroke-linecap="round"/>
  <path d="M5.5 3.8H116.5" stroke="#e6ecef" stroke-width="0.7" opacity="0.6"/>
  <path d="M9.6 22.9H123.1" stroke="#dce2e6" stroke-width="0.7" opacity="0.6"/>
  <path d="M12 25H125" stroke="#a9b2b9" stroke-width="0.6" opacity="0.5"/>
  <!-- long soft sheen on the top flange -->
  <path d="M30 9L56 9L49 3.8L23 3.8Z" fill="url(#bm-glint)"/>
  <!-- paint chips (rust under the paint) and scratches -->
  <g fill="#a4522b" opacity="0.8"><path d="M52 10.4l2.6-0.2l0.8 1.1l-1.6 0.7l-1.4-0.4z"/><path d="M88.5 10.2l1.8 0l0.5 1l-1.3 0.5l-1-0.5z"/><path d="M29 26.4l2-0.2l0.6 1l-1.4 0.5z"/></g>
  <g fill="#d3d9dd" opacity="0.85"><path d="M52.3 10.5l1.5-0.1l0.3 0.5l-1.2 0.2z"/><path d="M88.8 10.3l1 0l0.2 0.4l-0.8 0.2z"/></g>
  <path d="M70 6.4L77 5.6M96 7.2L101 6.6" stroke="#59636a" stroke-width="0.4" opacity="0.6"/>
  <path d="M63 6L68 5.4" stroke="#e6ecef" stroke-width="0.4" opacity="0.7"/>
  <g fill="#454c52" opacity="0.6"><circle cx="46" cy="23.8" r="0.5"/><circle cx="84" cy="26.2" r="0.5"/><circle cx="108" cy="25.6" r="0.4"/><circle cx="20" cy="26" r="0.45"/></g>
  <!-- sawn end: saw marks, rust fringe -->
  <g stroke="#7c8288" stroke-width="0.35" opacity="0.7"><path d="11.5 14.5L4.5 10"/></g>
  <path d="M11.5 28L4.5 22.8L4.5 19.1L6.9 20.9L6.9 9.3L4.5 7.5L4.5 3.8L11.5 9L11.5 12.7L9.1 10.9L9.1 22.5L11.5 24.3Z" fill="#a4522b" opacity="0.14"/>
  <!-- grime wash along the bottom flange -->
  <path d="M11.5 24.3L125.5 24.3L125.5 28L11.5 28Z" fill="#2a2d30" opacity="0.1"/>
  <!-- outlines -->
  <g fill="none" stroke="#2a2d30" stroke-width="0.9" stroke-linejoin="round">
    <path d="M11.5 28L4.5 22.8L4.5 19.1L6.9 20.9L6.9 9.3L4.5 7.5L4.5 3.8L11.5 9L11.5 12.7L9.1 10.9L9.1 22.5L11.5 24.3Z"/>
    <path d="M11.5 9L125.5 9L118.5 3.8L4.5 3.8Z"/>
    <path d="M11.5 9L125.5 9L125.5 12.7L11.5 12.7Z"/>
    <path d="M11.5 24.3L125.5 24.3L125.5 28L11.5 28Z"/>
    <path d="M11.5 24.3L125.5 24.3L123.1 22.5L9.1 22.5Z" stroke-width="0.7"/>
    <path d="M9.1 10.9L123.1 10.9L123.1 22.5L9.1 22.5Z" stroke-width="0.7" opacity="0.8"/>
  </g>
</svg>

    <linearGradient id="ad-vig" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d1a22" stop-opacity="0.5"/><stop offset="0.22" stop-color="#1d1a22" stop-opacity="0"/><stop offset="0.78" stop-color="#1d1a22" stop-opacity="0"/><stop offset="1" stop-color="#1d1a22" stop-opacity="0.5"/></linearGradient>

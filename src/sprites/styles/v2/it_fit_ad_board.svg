    <path d="M57.2 10C57.4 6 63.6 7.4 63.6 3.4" fill="none" stroke="#8b8998" stroke-width="0.5" opacity="0.8" stroke-linecap="round"/>
    <rect x="62.6" y="1" width="4" height="2" rx="0.7" fill="#8d9297" stroke="#2a2d30" stroke-width="0.7"/>

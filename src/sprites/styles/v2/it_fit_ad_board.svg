  <!-- a hung ad board seen from the front, hanging a degree off true: two chains from ceiling brackets to eye-lugs, a thick light-alloy bezel
       (rivets, scuffs, a rust run), a recessed face with a glass-fronted film strip (sprocket holes; the lit centre frame is the one need
       being advertised, a water drop; bread and a red cross wait dimmed either side), a cracked glass corner held with tape, an amber LED
       caption strip spelling WATER, two status lamps and a NEXT button, and a black power lead looping up to the ceiling -->
  <g transform="rotate(-1.1 48 36)">
    <!-- ceiling brackets, chains, power lead -->
    <rect x="15.5" y="0.9" width="9" height="2.2" rx="0.8" fill="url(#ad-iron)" stroke="#2a2d30" stroke-width="0.8"/>
    <rect x="71.5" y="0.9" width="9" height="2.2" rx="0.8" fill="url(#ad-iron)" stroke="#2a2d30" stroke-width="0.8"/>

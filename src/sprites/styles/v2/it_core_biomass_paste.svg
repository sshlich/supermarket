<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bp-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4c8b4"/>
      <stop offset="0.5" stop-color="#a9ae99"/>
      <stop offset="1" stop-color="#90957f"/>
    </linearGradient>
    <linearGradient id="bp-front" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8f9483"/>
      <stop offset="1" stop-color="#6c7263"/>
    </linearGradient>
    <linearGradient id="bp-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7161"/>
      <stop offset="1" stop-color="#4b5144"/>
    </linearGradient>
    <clipPath id="bp-body"><path d="M3 15.8Q3 13.4 4.8 11.9L8.2 9.1Q10 7.6 12.4 7.6L26.6 7.6Q29 7.6 29 10L29 19.4Q29 21.8 27.1 23.3L23.9 25.9Q22 27.4 19.6 27.4L5.4 27.4Q3 27.4 3 25Z"/></clipPath>
  </defs>
  <!-- a pressed brick of grey biomass paste, soft-cornered and slumped, three-quarter view: dented top, damp front with a chipped corner,
       a green weep of culture and a batch stencil; side face in shade -->
  <path d="M5 28.4C12 29.8 22 29.8 29.4 24L29 22.4L23 27.6H5Z" fill="#0b0810" opacity="0.35"/>
  <g clip-path="url(#bp-body)">
    <path d="M22 13.4L30 6.4V22L22 28.4Z" fill="url(#bp-side)"/>
    <path d="M2 13.4H22V28.4H2Z" fill="url(#bp-front)"/>
    <path d="M2 13.4L10 6.4H30L22 13.4Z" fill="url(#bp-top)"/>
    <!-- slumped lower belly, pressing marks -->
    <path d="M2 24.4C8 25.6 15 25.2 22 24L22 28.4H2Z" fill="#565c4b" opacity="0.5"/>
    <path d="M22 22.6L30 17V22L22 28.4Z" fill="#3f4538" opacity="0.4"/>
    <!-- top: a thumb dent and two shallow press ribs -->
    <ellipse cx="18.6" cy="10.8" rx="4.4" ry="1.9" fill="#80856f" opacity="0.7" transform="rotate(-16 18.6 10.8)"/>
    <path d="M14.6 10.2Q18 8.8 22.4 9.6" fill="none" stroke="#5a6050" stroke-width="0.7" opacity="0.7" stroke-linecap="round"/>
    <path d="M15.4 12.2Q19 11.8 22.8 10.8" fill="none" stroke="#d5d8c4" stroke-width="0.7" opacity="0.7" stroke-linecap="round"/>
    <!-- front: faint press strata, one damp green weep -->
    <path d="M3 17.6C8 16.8 14 18.2 22 17.2" fill="none" stroke="#a6ab95" stroke-width="0.7" opacity="0.55"/>
    <path d="M13 13.8L15 13.8C14.7 15.4 14.8 16.6 14.5 18.2L13.6 18.2C13.5 16.6 13.3 15.4 13 13.8Z" fill="#5b6836" opacity="0.7"/>
    <circle cx="14.05" cy="18.8" r="0.8" fill="#5b6836" opacity="0.85"/>
    <circle cx="13.8" cy="18.5" r="0.28" fill="#c4d094"/>
    <!-- grain: light and dark crumbs -->
    <g fill="#b5ba9f" opacity="0.7">
      <circle cx="7.4" cy="19.6" r="0.5"/><circle cx="18.5" cy="21.6" r="0.45"/><circle cx="10.4" cy="15.8" r="0.4"/><circle cx="20.2" cy="16.2" r="0.4"/><circle cx="25.4" cy="14.6" r="0.4"/>
    </g>
    <g fill="#4a5040" opacity="0.65">
      <circle cx="9.6" cy="21.6" r="0.5"/><circle cx="17.2" cy="18.4" r="0.4"/><circle cx="26" cy="18.4" r="0.55"/><circle cx="24.6" cy="12.4" r="0.45"/><circle cx="11.4" cy="9.6" r="0.4"/>
    </g>
    <g fill="#7a9a4a" opacity="0.9">
      <circle cx="7" cy="17" r="0.65"/><circle cx="20" cy="19.2" r="0.55"/><circle cx="26.6" cy="21" r="0.5"/><circle cx="13" cy="24.2" r="0.5"/>
    </g>
  </g>
  <!-- the chipped corner (front, top-left): crumbly pale innards -->
  <path d="M3 15.8Q3 13.4 4.8 11.9L6.6 10.4L7.4 12.4L6.2 13.2L6.8 15L5 15.6L4.6 17.6L3 17Z" fill="#b6baa2" stroke="#4a5040" stroke-width="0.5" stroke-linejoin="round"/>
  <path d="M4.2 14L5.4 12.4" stroke="#e8ebd8" stroke-width="0.6" opacity="0.9" stroke-linecap="round"/>
  
  <!-- batch stencil blocks, low on the front face -->
  <g fill="#40463a" opacity="0.8">
    <rect x="15" y="22.2" width="1.3" height="1.9" rx="0.2"/><rect x="16.8" y="22.2" width="0.8" height="1.9" rx="0.2"/><rect x="18.1" y="22.2" width="1.3" height="1.9" rx="0.2"/><rect x="19.9" y="22.2" width="0.8" height="1.9" rx="0.2"/>
    <rect x="5.4" y="22.6" width="5.6" height="1.1" rx="0.4" opacity="0.8"/>
  </g>
  <path d="M7.6 13.8H21.6" fill="none" stroke="#dfe2cd" stroke-width="0.9" opacity="0.7" stroke-linecap="round"/>
  <path d="M7.6 14.8H21.6" fill="none" stroke="#5f6556" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
  <!-- lit rim along the top-left, soft seam between faces -->
  <path d="M3.7 24.6V15.9Q3.7 14 5.1 12.8L8.7 9.7Q10.2 8.4 12.5 8.4H27" fill="none" stroke="#e6e9d6" stroke-width="0.9" opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22.2 13.6L28.4 8.4M22 14V26.8" fill="none" stroke="#3d4334" stroke-width="0.7" opacity="0.55" stroke-linecap="round"/>
  <path d="M3 15.8Q3 13.4 4.8 11.9L8.2 9.1Q10 7.6 12.4 7.6L26.6 7.6Q29 7.6 29 10L29 19.4Q29 21.8 27.1 23.3L23.9 25.9Q22 27.4 19.6 27.4L5.4 27.4Q3 27.4 3 25Z" fill="none" stroke="#323829" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- cold sweat beads -->
  <circle cx="27" cy="12.8" r="0.55" fill="#e3f0ec" opacity="0.75"/><circle cx="6" cy="25" r="0.5" fill="#e3f0ec" opacity="0.7"/>
</svg>

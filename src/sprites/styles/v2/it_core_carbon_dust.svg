  <path d="M2.2 28C2.4 25.2 3.8 22 6 19C8 16.2 9.8 12.8 12 11.6C14.2 10.6 16.6 11.4 18.4 13.6C20.8 16.6 23 19.4 26 22.6C28 24.8 30.2 26.4 30.4 28C30.5 28.9 29.2 29.4 27.8 29.4H5C3 29.4 2 28.9 2.2 28Z" fill="none" stroke="#221a20" stroke-width="1.1" stroke-linejoin="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64">
  <defs>
    <linearGradient id="bn-cloth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c3f35"/><stop offset="0.0625" stop-color="#662821"/><stop offset="0.11" stop-color="#c0684f"/><stop offset="0.18" stop-color="#a64f41"/><stop offset="0.25" stop-color="#833a31"/>
      <stop offset="0.278" stop-color="#662821"/><stop offset="0.325" stop-color="#c0684f"/><stop offset="0.395" stop-color="#a64f41"/><stop offset="0.465" stop-color="#833a31"/>
      <stop offset="0.5" stop-color="#662821"/><stop offset="0.545" stop-color="#c0684f"/><stop offset="0.615" stop-color="#a64f41"/><stop offset="0.685" stop-color="#833a31"/>
      <stop offset="0.722" stop-color="#662821"/><stop offset="0.77" stop-color="#c0684f"/><stop offset="0.84" stop-color="#a64f41"/><stop offset="0.905" stop-color="#833a31"/>
      <stop offset="0.9375" stop-color="#662821"/><stop offset="1" stop-color="#7e3830"/>
    </linearGradient>
    <linearGradient id="bn-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0e0c" stop-opacity="0.5"/><stop offset="0.16" stop-color="#2a0e0c" stop-opacity="0"/><stop offset="0.7" stop-color="#2a0e0c" stop-opacity="0"/><stop offset="1" stop-color="#2a0e0c" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="bn-pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ab6e"/><stop offset="0.3" stop-color="#c99a5e"/><stop offset="0.68" stop-color="#a9733f"/><stop offset="1" stop-color="#6b4423"/>
    </linearGradient>
    <radialGradient id="bn-brass" cx="0.33" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fbe08a"/><stop offset="0.45" stop-color="#e0b43a"/><stop offset="1" stop-color="#a97a14"/>
    </radialGradient>
    <linearGradient id="bn-tab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0684f"/><stop offset="0.55" stop-color="#9a4a3e"/><stop offset="1" stop-color="#733029"/>
    </linearGradient>
    <clipPath id="bn-clip"><path d="M12 12L84 12Q82.4 36 83.6 58.5L48 51L12.4 58.5Q10.6 36 12 12Z"/></clipPath>
  </defs>
  <!-- a cloth crew banner hung from a wooden pole: a red swallow-tailed cloth falling in folds from five loop tabs, a painted star ring and
       stencilled SPINE, a stitched patch, brass finials and tassels; lit from the top left -->
  <ellipse cx="50" cy="61.2" rx="36" ry="1.6" fill="#000" opacity="0.18"/>
  <!-- the cloth -->
  <path d="M12 12L84 12Q82.4 36 83.6 58.5L48 51L12.4 58.5Q10.6 36 12 12Z" fill="url(#bn-cloth)"/>
  <g clip-path="url(#bn-clip)">
    <rect x="12" y="12" width="72" height="48" fill="url(#bn-fade)"/>
    <!-- fold creases fanning from the tabs -->
    <g fill="none" stroke-linecap="round">
      <path d="M32 17C31 28 33 40 31 55" stroke="#4a1a16" stroke-width="0.8" opacity="0.4"/>
      <path d="M48 17C49 26 47 36 48.5 48" stroke="#4a1a16" stroke-width="0.8" opacity="0.4"/>
      <path d="M64 17C65 28 63 40 65 55" stroke="#4a1a16" stroke-width="0.8" opacity="0.4"/>
      <path d="M16.5 17C16 30 17 44 15.5 58" stroke="#4a1a16" stroke-width="0.7" opacity="0.35"/>
      <path d="M79.5 17C80 30 79 44 80.5 58" stroke="#4a1a16" stroke-width="0.7" opacity="0.35"/>
      <path d="M35.5 20C35 30 36.5 40 35 52M51.5 20C52 28 51 36 52.5 46M67.5 20C67 30 68.5 42 67 54M20.5 20C20 32 21 44 19.5 56M83 20C82.5 32 83 44 82.5 56" stroke="#e08a76" stroke-width="0.8" opacity="0.4"/>
    </g>
    <!-- weave: faint horizontal threads -->
    <path d="M12 21.5H84M12 27.5H84M12 33.5H84M12 39.5H84M12 45.5H84M12 51.5H84" stroke="#4a1a16" stroke-width="0.4" opacity="0.13" stroke-dasharray="1.2 1.1"/>
    <!-- a faded water stain and grime near the hem -->
    <ellipse cx="25" cy="50" rx="9" ry="3.6" fill="#4a1a16" opacity="0.16"/>
    <ellipse cx="71" cy="47" rx="6" ry="2.4" fill="#4a1a16" opacity="0.12"/>
  </g>
  <!-- painted cream trim band under the pole and the sewn hem -->
    <path d="M16.8 19.5Q15.6 38 16.8 55M79.4 19.5Q78.2 38 79.4 55" stroke="#d8c9a4" stroke-width="1.5" opacity="0.9" stroke-linecap="round"/>
  <path d="M17.6 19.5Q16.4 38 17.6 55" stroke="#4a1a16" stroke-width="0.4" opacity="0.35" fill="none"/>
  <path d="M14.4 22Q13.1 38 14.3 54M81.4 22Q80.1 38 81.2 54" stroke="#dccfa6" stroke-width="0.7" stroke-dasharray="2.2 1.6" opacity="0.65"/>
  <path d="M15.2 55.2L40 49.9M80.8 55.2L56 49.9" stroke="#dccfa6" stroke-width="0.7" stroke-dasharray="2.2 1.6" opacity="0.65"/>
  <!-- the painted crew mark: a ring with a star, a touch uneven -->
  <circle cx="48" cy="28.4" r="8.4" fill="#7a3029" fill-opacity="0.55"/>
  <circle cx="48" cy="28.4" r="8.4" fill="none" stroke="#dccfa6" stroke-width="1.9"/>
  <path d="M40.4 26C41.4 23 44 21 47 20.4" fill="none" stroke="#fff4d0" stroke-width="0.8" opacity="0.7" stroke-linecap="round"/>
  <path transform="translate(0 1.4)" d="M48 21.2L49.4 25.1L53.5 25.2L50.3 27.7L51.4 31.7L48 29.4L44.6 31.7L45.7 27.7L42.5 25.2L46.6 25.1Z" fill="#dccfa6" stroke="#e8dcb4" stroke-width="0.4" stroke-linejoin="round"/>
  <path d="M47.8 37.4L47.5 38.8" stroke="#dccfa6" stroke-width="1" stroke-linecap="round"/>
  <!-- stencilled slogan -->
  <path fill="#e2d3a8" shape-rendering="crispEdges" d="M32.8 40.6h4.8v1.6h-4.8zM32.8 42.2h1.6v3.2h-1.6zM34.4 43.8h3.2v1.6h-3.2zM36 45.4h1.6v3.2h-1.6zM32.8 47h3.2v1.6h-3.2zM39.2 40.6h4.8v1.6h-4.8zM39.2 42.2h1.6v6.4h-1.6zM42.4 42.2h1.6v3.2h-1.6zM40.8 43.8h1.6v1.6h-1.6zM45.6 40.6h4.8v1.6h-4.8zM47.2 42.2h1.6v6.4h-1.6zM45.6 47h1.6v1.6h-1.6zM48.8 47h1.6v1.6h-1.6zM52 40.6h3.2v1.6h-3.2zM52 42.2h1.6v6.4h-1.6zM55.2 42.2h1.6v6.4h-1.6zM58.4 40.6h4.8v1.6h-4.8zM58.4 42.2h1.6v6.4h-1.6zM60 43.8h1.6v1.6h-1.6zM60 47h3.2v1.6h-3.2z"/>
  <!-- a stitched patch of grey cloth with cross stitches -->
  <path d="M19.5 33L29.5 32.5L30 42.3L20 43Z" fill="#6c7a86" stroke="#3e4852" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M19.5 33L29.5 32.5L29.6 34.5L19.6 35Z" fill="#8c9aa6" opacity="0.6"/>
  <path d="M21 34.7L28.5 34.3M21.4 41.1L28.8 40.7M21 34.7L21.3 41.1M28.5 34.3L28.8 40.7" stroke="#e8dcb4" stroke-width="0.6" stroke-dasharray="1.2 0.9" fill="none"/>
  <path d="M22.6 36.9L27 39.1M27 36.9L22.6 39.1" stroke="#e8dcb4" stroke-width="0.6" stroke-linecap="round"/>
  <!-- the hem edge: lit on the left, a thin dark line on the cut -->
  <path d="M12 12L84 12Q82.4 36 83.6 58.5L48 51L12.4 58.5Q10.6 36 12 12Z" fill="none" stroke="#4a1a16" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M13 57.4L47 50.2" stroke="#e8a090" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
  <!-- tassels -->
  <g stroke="#a97a14" stroke-width="0.7" stroke-linecap="round"><path d="M11.3 59.5L10.6 62.8M12.4 59.8L12.4 63M13.5 59.5L14.2 62.8M84.5 59.5L85.2 62.8M83.6 59.8L83.6 63M82.7 59.5L82 62.8"/></g>
  <circle cx="12.4" cy="59" r="1.5" fill="url(#bn-brass)" stroke="#6e4c0c" stroke-width="0.5"/><circle cx="83.6" cy="59" r="1.5" fill="url(#bn-brass)" stroke="#6e4c0c" stroke-width="0.5"/>
  <!-- the pole -->
  <path d="M9 4.8L87 4.8L87 12.4L9 12.4Z" fill="url(#bn-pole)" stroke="#3e2410" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M10 6.2L86 6.2" stroke="#f3d29a" stroke-width="0.9" opacity="0.7" stroke-linecap="round"/>
  <path d="M20 8.6H28M44 9.2H60M70 8.2H80M12 10.6H18" stroke="#6b4423" stroke-width="0.6" opacity="0.6" stroke-linecap="round"/>
  <ellipse cx="38" cy="8.7" rx="2" ry="1" fill="none" stroke="#6b4423" stroke-width="0.6" opacity="0.6"/>
  <!-- brass collars and finials -->
  <rect x="9" y="4.2" width="2.8" height="8.8" rx="0.8" fill="#c8942a" stroke="#6e4c0c" stroke-width="0.6"/><rect x="84.2" y="4.2" width="2.8" height="8.8" rx="0.8" fill="#a97a14" stroke="#6e4c0c" stroke-width="0.6"/>
  <circle cx="6.2" cy="8.6" r="4.2" fill="url(#bn-brass)" stroke="#6e4c0c" stroke-width="1"/><circle cx="89.8" cy="8.6" r="4.2" fill="url(#bn-brass)" stroke="#6e4c0c" stroke-width="1"/>
  <path d="M4.2 7.2C4.8 5.8 6 5.2 7.2 5.4" stroke="#fff8d6" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M87.8 7.2C88.4 5.8 89.6 5.2 90.8 5.4" stroke="#fff8d6" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- loop tabs folded over the pole -->
  <g stroke="#4a1a16" stroke-width="0.9" stroke-linejoin="round">
    <path d="M13.2 4.6Q16.5 3.6 19.8 4.6L19.8 18L13.2 18Z" fill="url(#bn-tab)"/>
    <path d="M28.7 4.6Q32 3.6 35.3 4.6L35.3 18L28.7 18Z" fill="url(#bn-tab)"/>
    <path d="M44.7 4.6Q48 3.6 51.3 4.6L51.3 18L44.7 18Z" fill="url(#bn-tab)"/>
    <path d="M60.7 4.6Q64 3.6 67.3 4.6L67.3 18L60.7 18Z" fill="url(#bn-tab)"/>
    <path d="M76.2 4.6Q79.5 3.6 82.8 4.6L82.8 18L76.2 18Z" fill="url(#bn-tab)"/>
  </g>
  <g stroke="#e8a090" stroke-width="0.6" opacity="0.6" stroke-linecap="round"><path d="M14.4 6V16.5M29.9 6V16.5M45.9 6V16.5M61.9 6V16.5M77.4 6V16.5"/></g>
  <g stroke="#dccfa6" stroke-width="0.6" stroke-dasharray="1.2 1" opacity="0.7"><path d="M13.8 17.2H19.2M29.3 17.2H34.7M45.3 17.2H50.7M61.3 17.2H66.7M76.8 17.2H82.2"/></g>
  <!-- grime specks -->
  <g fill="#2a0e0c" opacity="0.5"><circle cx="24" cy="30" r="0.5"/><circle cx="70" cy="37" r="0.6"/><circle cx="58" cy="52" r="0.5"/><circle cx="35" cy="48" r="0.5"/><circle cx="77" cy="26" r="0.4"/></g>
</svg>

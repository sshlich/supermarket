  <path d="M82.5 26L85.6 21.8" stroke="#b5432f" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="82.5" cy="26" r="1.2" fill="#2a2d30"/>
  <path d="M78.5 22.2Q80.5 20 83 20" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.7" stroke-linecap="round"/>

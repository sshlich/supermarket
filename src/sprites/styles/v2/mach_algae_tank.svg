  <path d="M74.5 16V77" stroke="#e4e8ea" stroke-width="0.8" opacity="0.6"/>
  <path d="M78 6H88V14H78Z" fill="url(#at-steelv)" stroke="#2a2d30" stroke-width="1" stroke-linejoin="round"/>

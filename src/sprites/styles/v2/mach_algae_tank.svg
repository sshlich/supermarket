<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="at-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4b9bd"/><stop offset="0.45" stop-color="#8d9297"/><stop offset="1" stop-color="#5f6468"/>
    </linearGradient>
    <linearGradient id="at-steelv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a8ad"/><stop offset="1" stop-color="#5f6468"/>
    </linearGradient>
    <linearGradient id="at-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2ea86"/><stop offset="0.22" stop-color="#86d27a"/><stop offset="0.6" stop-color="#4aa466"/><stop offset="1" stop-color="#256b48"/>
    </linearGradient>
    <linearGradient id="at-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f3a35" stop-opacity="0"/><stop offset="0.55" stop-color="#0f3a35" stop-opacity="0.08"/><stop offset="1" stop-color="#0f3a35" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="at-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c4" stop-opacity="0.55"/><stop offset="1" stop-color="#fff4c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="at-cu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6a46a"/><stop offset="0.5" stop-color="#c1763f"/><stop offset="1" stop-color="#8a4a22"/>
    </linearGradient>
    <radialGradient id="at-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9fd8" stop-opacity="0.6"/><stop offset="1" stop-color="#ff9fd8" stop-opacity="0"/>
    </radialGradient>

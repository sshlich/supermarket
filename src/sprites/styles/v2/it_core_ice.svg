    <path d="M8 34L14 29.5L20.5 31.5L26.5 29L31 36" fill="none" stroke="#e9f2f6" stroke-width="0.9" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M31 36L28.5 45L30 52L20 55L12.5 51.5L9 43L8 34" fill="none" stroke="#56636e" stroke-width="1" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- dust strata on the left crust and the shaded right face -->
    <g fill="none" stroke-linecap="round">
      <path d="M5 28C9 30 12 27.5 15 29" stroke="#5c6670" stroke-width="1" opacity="0.5"/>
      <path d="M5 56C9 53 12 55.5 16 53" stroke="#5c6670" stroke-width="1.6" opacity="0.5"/>
      <path d="M31 40C33 42 34 46 33.4 50M32.6 48C34 52 33.6 56 34.4 58.6" stroke="#8e8174" stroke-width="1.3" opacity="0.55"/>
      <path d="M40 38C46 37 50 39 60 35" stroke="#2f3a4a" stroke-width="1.6" opacity="0.55"/>
      <path d="M38 47C44 46 48 49 54 46.5" stroke="#9a8c7e" stroke-width="1.2" opacity="0.4"/>
      <path d="M41 54C46 53 50 55 53 53.6" stroke="#2f3a4a" stroke-width="1.3" opacity="0.5"/>
    </g>
    <!-- grit and pocks on the faces -->
    <g fill="#55616b" opacity="0.7"><circle cx="9" cy="51" r="0.7"/><circle cx="33" cy="33" r="0.6"/><circle cx="25" cy="57" r="0.8"/><circle cx="33" cy="52" r="0.7"/><circle cx="35.5" cy="43" r="0.6"/><circle cx="7" cy="31" r="0.5"/></g>
    <g fill="#2c3646" opacity="0.7"><circle cx="47" cy="43" r="0.8"/><circle cx="43" cy="52" r="0.6"/><circle cx="56" cy="30" r="0.6"/><circle cx="41" cy="33" r="0.5"/></g>
    <!-- chipped bottom-right corner: clear ice in shade -->
    <path d="M60.5 38L57 46L58 50L52 55L46 56.6L50 50L54 44Z" fill="url(#ic-clear2)"/>
    <path d="M54 44L50 50L46 56.6M57 46L54 44L60.5 38" fill="none" stroke="#9fdbe6" stroke-width="0.6" opacity="0.7" stroke-linejoin="round"/>
    <path d="M60.5 38L54 44L50 50" fill="none" stroke="#c6eef3" stroke-width="0.9" opacity="0.7" stroke-linecap="round"/>
    <!-- stencilled haul mark on the right face, skewed to sit on it, worn through in places -->
    <g transform="translate(40.8 40) skewY(-18) scale(0.86)" opacity="0.72">
      <path fill="#d98a3a" shape-rendering="crispEdges" d="M0 0h4v1h-4zM0 4h4v1h-4zM1.5 1h1v3h-1z"/>
      <path fill="#d98a3a" shape-rendering="crispEdges" d="M5.5 0h4v1h-4zM5.5 1h1v3h-1zM5.5 4h4v1h-4z"/>
      <path fill="#d98a3a" shape-rendering="crispEdges" d="M11 0h4v1h-4zM11 1h1v3h-1zM11 2h3v1h-3zM11 4h4v1h-4z"/>
    </g>
    <g fill="#434f63" opacity="0.75"><circle cx="43.6" cy="39.8" r="0.8"/><circle cx="52.4" cy="37.6" r="0.7"/><circle cx="49" cy="43" r="0.5"/></g>
    <!-- rime dendrites on the top face -->
    <g fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.85">
      <path d="M31 17.4V20.2M29.6 18.8H32.4M30 17.8L32 19.8M32 17.8L30 19.8"/>
      <path d="M43 14.6V16.8M41.9 15.7H44.1"/>
      <path d="M21 21.4V23.4M20 22.4H22"/>
    </g>
    <!-- bounce light from the cold floor along the bottom-right edge -->
    <path d="M60 40L56.6 48L51.6 54.4L44 56.4L36.6 59" fill="none" stroke="#7fb4d0" stroke-width="1.1" opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- a soft sheen across the shaded face, and frost along the lit top edges -->
    <path d="M38 33L50 27L50 31L38 38Z" fill="#c6eef3" opacity="0.14"/>
    <path d="M37.6 31L36 59" fill="none" stroke="#9fb1c4" stroke-width="0.8" opacity="0.5"/>
    <g fill="#f4fbfd" opacity="0.9"><circle cx="16.5" cy="11.5" r="0.7"/><circle cx="21" cy="8.6" r="0.6"/><circle cx="27" cy="6.8" r="0.7"/><circle cx="37" cy="5.6" r="0.6"/><circle cx="9" cy="22" r="0.6"/><circle cx="19" cy="26" r="0.5"/><circle cx="13" cy="14" r="0.5"/></g>
  </g>
  <!-- glints on the clear ice -->
  <path d="M15.6 31.4V34.6M14 33H17.2" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  <path d="M50.4 9.6V12M49.2 10.8H51.6" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"/>
  <!-- ridges: lit along the top-left, creased along the shaded edges -->
  <path d="M4 35L6 24L11 15L15 10L24 7L32 5L42 4" fill="none" stroke="#f2fafc" stroke-width="1.1" opacity="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6 24L19 27L38 30L59 18" fill="none" stroke="#5b6873" stroke-width="0.8" opacity="0.8" stroke-linejoin="round"/>
  <path d="M38 30L36 60" fill="none" stroke="#3a4656" stroke-width="0.9" opacity="0.8"/>
  <path d="M19 27L38 30" fill="none" stroke="#e6f1f5" stroke-width="0.6" opacity="0.55"/>
  <!-- a drip hanging from the lower edge -->
  <path d="M46.6 56.4C47 57.8 46.8 58.6 46.6 59.2C46.2 58.4 46.2 57.2 46.6 56.4Z" fill="#bfe3e6" stroke="#3f7f86" stroke-width="0.4"/>
  <path d="M6 24L11 15L15 10L24 7L32 5L42 4L50 6.5L55 11L59 18L60 30L60.5 40L57 48L52 55L44 57L36 60L26 59L17 57L9 52L5 46L4 35Z" fill="none" stroke="#3d4856" stroke-width="1.2" stroke-linejoin="round"/>
</svg>

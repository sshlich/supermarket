<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ic-top" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#dbe9f0"/>
      <stop offset="0.55" stop-color="#b4c6d1"/>
      <stop offset="1" stop-color="#97a8b4"/>
    </linearGradient>
    <linearGradient id="ic-left" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#aebdc7"/>
      <stop offset="1" stop-color="#7d8c98"/>
    </linearGradient>
    <linearGradient id="ic-right" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#6b7b8e"/>
      <stop offset="1" stop-color="#434f63"/>
    </linearGradient>
    <linearGradient id="ic-clear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2fcfd"/>
      <stop offset="0.45" stop-color="#a6dbe4"/>
      <stop offset="1" stop-color="#4f93ad"/>
    </linearGradient>
    <linearGradient id="ic-clear2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd0de"/>
      <stop offset="1" stop-color="#2f6f8c"/>
    </linearGradient>
    <clipPath id="ic-body"><path d="M6 24L11 15L15 10L24 7L32 5L42 4L50 6.5L55 11L59 18L60 30L60.5 40L57 48L52 55L44 57L36 60L26 59L17 57L9 52L5 46L4 35Z"/></clipPath>
  </defs>
  <!-- a hauled block of comet ice: grey dust-crusted faces, a clean fracture window of blue glassy ice with trapped bubbles,
       two chipped corners, frost on the lit edges, a stencilled haul mark, shards and meltwater at the foot -->
  <!-- contact shadow, meltwater, spilled shards -->
  <ellipse cx="34" cy="60.4" rx="22" ry="2.4" fill="#120e18" opacity="0.4"/>
  <path d="M40 59.6C46 57.8 54 58.6 58.5 60.6C54 62.4 44 62.6 40 59.6Z" fill="#6aa8c8" opacity="0.55"/>
  <path d="M5 59.6L8 56.4L11 59.2L9 61.4Z" fill="#cfeff3" stroke="#3f7f86" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M8 56.4L11 59.2L9 61.4Z" fill="#7fbccd"/>
  <path d="M12.8 61L14.6 58.8L17 60.8L15 62Z" fill="#bfe3e6" stroke="#3f7f86" stroke-width="0.6" stroke-linejoin="round"/>
  <g clip-path="url(#ic-body)">
    <!-- the three faces -->
    <path d="M0 0H64V64H0Z" fill="url(#ic-left)"/>
    <path d="M4 24L15 10L32 5L50 6L59 18L38 30L19 27Z" fill="url(#ic-top)"/>
    <path d="M38 30L59 18L61 40L52 55L36 60Z" fill="url(#ic-right)"/>
    <!-- dust on the top face: dark drifts and grit -->
    <g fill="#7c8791" opacity="0.5">
      <path d="M16 15C20 11.5 26 12.5 28 15.4C25.5 18 20 18.4 16 17Z"/>
      <path d="M39 9.4C43 8.4 47.6 10.4 47 13.2C44 14.4 39.6 13 39 9.4Z"/>
      <path d="M29 21.4C33 20 38 21.6 36.4 23.8C33.4 24.6 29.6 24 29 21.4Z"/>
      <path d="M49 21L54 17.6L55.4 20.4Z"/>
    </g>
    <path d="M18 13.6C22 12.2 25 13.4 26.6 14.8" fill="none" stroke="#5a6670" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
    <g fill="#5d6870" opacity="0.7"><circle cx="24" cy="20" r="0.7"/><circle cx="34" cy="13" r="0.6"/><circle cx="44" cy="19" r="0.7"/><circle cx="12" cy="20" r="0.6"/><circle cx="52" cy="12" r="0.5"/><circle cx="29" cy="9" r="0.5"/><circle cx="41" cy="24" r="0.5"/></g>
    <!-- chipped top-right corner: clear ice showing -->
    <path d="M44 4L50 6.5L55 11L59 18L52.5 17.4L49 12.4L46 8Z" fill="url(#ic-clear)"/>
    <path d="M46 8L49 12.4L52.5 17.4M49 12.4L55 11" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.75" stroke-linejoin="round"/>
    <path d="M52.5 17.4L59 18L55 11Z" fill="#4f93ad" opacity="0.45"/>
    <!-- left face: the clean fracture window with a jagged crust edge -->
    <path d="M8 34L14 29.5L20.5 31.5L26.5 29L31 36L28.5 45L30 52L20 55L12.5 51.5L9 43Z" fill="url(#ic-clear)"/>
    <path d="M14 29.5L20.5 31.5L17 38L9.5 36.5Z" fill="#ffffff" opacity="0.5"/>
    <path d="M20.5 31.5L26.5 29L31 36L24 41L17 38Z" fill="#dff5f8" opacity="0.4"/>
    <path d="M24 41L31 36L28.5 45L30 52L22 49Z" fill="#3f84a3" opacity="0.5"/>
    <path d="M9 43L17 38L24 41L22 49L12.5 51.5Z" fill="#8fcddb" opacity="0.5"/>
    <!-- facet lines and hairline cracks through the clear ice -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 38L24 41L30 52M24 41L31 36M17 38L9.5 36.5M20.5 31.5L17 38" stroke="#ffffff" stroke-width="0.6" opacity="0.7"/>
      <path d="M12 48L16 45.5L15.5 42L19 40" stroke="#2f6f8a" stroke-width="0.6" opacity="0.7"/>
      <path d="M26 33L24.5 36.5L27 38.5" stroke="#2f6f8a" stroke-width="0.5" opacity="0.6"/>
    </g>
    <!-- trapped gas bubbles -->
    <g>
      <circle cx="14" cy="42" r="1.5" fill="#d8f3f6" stroke="#4f93ad" stroke-width="0.5"/><circle cx="13.5" cy="41.4" r="0.4" fill="#ffffff"/>
      <circle cx="22" cy="47" r="1" fill="#d8f3f6" stroke="#4f93ad" stroke-width="0.5"/><circle cx="21.7" cy="46.6" r="0.3" fill="#ffffff"/>
      <circle cx="26" cy="41" r="0.8" fill="#d8f3f6" stroke="#4f93ad" stroke-width="0.4"/>
      <circle cx="18.5" cy="35" r="0.6" fill="#ffffff" opacity="0.8"/>
    </g>

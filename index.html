class Hash2 {

  key(x, z) { return (Math.floor(x / this.cell) + 1000) * 4096 + (Math.floor(z / this.cell) + 1000); }

  free(x, z, d) {
    const cx = Math.floor(x / this.cell), cz = Math.floor(z / this.cell), n = Math.ceil(d / this.cell);
    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
      const a = this.map.get((cx + i + 1000) * 4096 + (cz + j + 1000)); if (!a) continue;

    }

}

const Sparks = (() => {

const Flies = (() => {

  for (let i = 0; i < NF; i++) {
    let x, z, y;
    const r0 = rng();
    if (r0 < 0.55) { const a = rand(0, TAU), r = rand(15, 34); x = Math.cos(a) * r; z = Math.sin(a) * r; y = rand(0.4, 3.2); }
    else if (r0 < 0.82) { const a = rand(0, TAU), r = Math.sqrt(rng()) * 20; x = Math.cos(a) * r; z = Math.sin(a) * r; y = rand(0.3, 1.6); }
    else { const a = rand(0, TAU), r = pondR(a) * rand(0.1, 1.0); x = Math.cos(a) * r; z = Math.sin(a) * r; y = rand(0.2, 1.3); }
    const g = heightAt(x, z);
    home[i * 3] = x; home[i * 3 + 1] = Math.max(g, WATER_Y) + y; home[i * 3 + 2] = z;
    glowPos[i * 3] = x; glowPos[i * 3 + 1] = home[i * 3 + 1]; glowPos[i * 3 + 2] = z;
    seed[i] = rng() * 100; rate[i] = rand(0.7, 1.6); ground[i] = Math.max(g, WATER_Y); hue[i] = rng();
  }
  let rr = 0;

    home, vel, flash,
    burst(x, y, z, n, radius = 1.2) {
      for (let k = 0; k < n; k++) {
        const i = Math.floor(Math.random() * NF);
        glowPos[i * 3] = x + mr(-radius, radius); glowPos[i * 3 + 1] = y + mr(-radius, radius) * 0.6; glowPos[i * 3 + 2] = z + mr(-radius, radius);
        vel[i * 3] = mr(-2.5, 2.5); vel[i * 3 + 1] = mr(0.2, 2.2); vel[i * 3 + 2] = mr(-2.5, 2.5);
        home[i * 3] = x + mr(-6, 6); home[i * 3 + 1] = Math.max(heightAt(home[i * 3], z), WATER_Y) + mr(0.4, 3); home[i * 3 + 2] = z + mr(-6, 6);
        flash[i] = 1;
      }
    },
    scatter(x, y, z, radius, power) {
      for (let i = 0; i < NF; i++) {

        if (d < radius && d > 1e-3) { const f = power * (1 - d / radius) / d; vel[i * 3] += dx * f; vel[i * 3 + 1] += Math.abs(dy) * f + power * 0.3; vel[i * 3 + 2] += dz * f; flash[i] = Math.max(flash[i], 0.8); }

      head = (head + 1) % CAP;

const Meteors = (() => {

  }

    spawn(near) {

      const base = near ? near.clone() : new V3(mr(-1, 1), mr(0.35, 0.8), mr(-1, 1)).normalize();
      base.y = Math.max(base.y, 0.2); base.normalize();

      o.a.copy(base).addScaledVector(d, -0.12).normalize(); o.b.copy(base).addScaledVector(d, 0.2).normalize();

        m.near = near;

  for (const o of reflHide) o.visible = false;
  waterOBR.call(this, r, s, c);
  for (const o of reflHide) o.visible = true;
};

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Q.dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w / h < 1 ? 66 : 50; camera.updateProjectionMatrix();
  CAM.dist = w / h < 1 ? 18.5 : 17.5;
  composer.setPixelRatio(Q.dpr); composer.setSize(w, h);
  water.getRenderTarget().setSize(Math.max(2, Math.round(w * Q.dpr * Q.refl)), Math.max(2, Math.round(h * Q.dpr * Q.refl)));
  finalPass.uniforms.uRes.value.set(w, h);
}
window.addEventListener('resize', resize);
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); running = false; document.getElementById('veil').classList.remove('gone'); });
canvas.addEventListener('webglcontextrestored', () => location.reload());
resize();

// ============================================================================
// Main loop
// ============================================================================
const clock = { t: 0, dt: 1 / 60, last: performance.now() };
let frameNo = 0;
const perf = { acc: 0, n: 0, stage: 0 };
function adapt(dt) {
  if (TEST || perf.stage >= 3 || clock.t < 5) return;
  perf.acc += dt; perf.n++;
  if (perf.acc < 2.5) return;
  const avg = perf.acc / perf.n; perf.acc = 0; perf.n = 0;
  if (avg > 1 / 45) {
    perf.stage++;
    Q.dpr = Math.max(0.7, Q.dpr * 0.78);
    grass.geometry.instanceCount = Math.floor(grass.geometry.userData.full * (perf.stage === 1 ? 0.8 : 0.6));
    if (perf.stage >= 2) Q.refl = 0.33;
    resize();
  } else perf.stage = 3;
}
function frame(now) {
  const dt = Math.min(0.05, Math.max(0.0001, (now - clock.last) / 1000));
  clock.last = now; clock.dt = dt; clock.t += dt;
  G.uTime.value = clock.t;
  finalPass.uniforms.uTime.value = clock.t;
  updateTime(dt);
  updateCamera(dt);
  camera.updateMatrixWorld();
  if (pointer.active) pick(pointer.nx, pointer.ny);
  updateWisp(dt);
  Field.update(dt, W.pos.x, W.pos.z, W.low && W.over !== 'water' ? W.energy * 0.9 : 0);
  Pond.update(dt);
  for (const f of flowerSets) f.update(dt, env.night, W.pos.x, W.pos.z, W.low && W.energy > 0.3);
  Mushrooms.update(dt, W);
  Flies.update(dt, sstep(0.06, -0.12, sunDir.y), W);
  Sparks.update(dt);
  Leaves.update(dt);
  Butterflies.update(dt, env.night, W);
  Birds.update(dt, env.day);
  Meteors.update(dt, env.stars);
  gPosAttr.needsUpdate = true; gColAttr.needsUpdate = true; gSizeAttr.needsUpdate = true;
  finalPass.uniforms.uExposure.value = P.exp;
  finalPass.uniforms.uLift.value.set(0.006, 0.01, 0.022).multiplyScalar(env.night).add(_lift.set(0.008, 0.005, 0).multiplyScalar(env.day));
  bloom.strength = P.bloom * 1.25;
  {
    // light shafts toward the sun (or the moon at night) when it is in view
    const useSun = sunDir.y > -0.04, dir = useSun ? sunDir : moonDir;
    _sv.copy(camera.position).addScaledVector(dir, 1000).project(camera);
    camera.getWorldDirection(_fw);
    const front = sstep(0.05, 0.35, dir.dot(_fw)), onScreen = 1 - sstep(1.1, 1.8, Math.max(Math.abs(_sv.x), Math.abs(_sv.y)));
    const vis = useSun ? skyU.uSunVis.value * 0.9 : skyU.uMoonVis.value * 0.45;
    bloom.shaftAmt = front * onScreen * vis * (1 - sstep(0.35, 0.7, dir.y));
    bloom.sunUV.set(_sv.x * 0.5 + 0.5, _sv.y * 0.5 + 0.5);
    bloom.comp.uniforms.uShaftTint.value.copy(useSun ? P.fsun : MOON_COLOR);
  }
  Audio.tick(dt, env.night, clamp(G.uWind.value - 0.4, 0, 1));
  if ((frameNo++ & 1) === 0) renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(null);
  composer.render(dt);
  adapt(dt);
}
let running = true;
function loop(now) { if (!running) return; frame(now); requestAnimationFrame(loop); }
const _lift = new V3(), _sv = new V3(), _fw = new V3();

// ambient falling leaves from broadleaf canopies
setInterval(() => {
  if (document.hidden) return;
  const t = nearTrees[Math.floor(Math.random() * nearTrees.length)];
  if (!t || !t.broad) return;
  const d = randomUnit(Math.random).multiplyScalar(t.pr * 0.7);
  Leaves.spawn(t.pc.x + d.x, t.pc.y + d.y * 0.5, t.pc.z + d.z, 0, 0, 0, (t.tint < 0 ? new Col(0xd07a22) : new Col(0x6a8a2a)).offsetHSL(mr(-0.04, 0.04), 0, mr(-0.06, 0.06)), mr(0.16, 0.22));
}, 1400);

// start: set time from #dawn / #day / #dusk / #night if present
const HASH_TIMES = { dawn: 0.27, day: 0.45, dusk: 0.745, night: 0.9 };
const hashKey = location.hash.replace('#', '');
if (HASH_TIMES[hashKey] !== undefined) TOD.t = HASH_TIMES[hashKey];

if (TEST) window.__dbg = { bloom, glowPoints, water, reflHide, scene, composer, renderer, Audio, interact, pick };
if (TEST) window.__glade = {
  setTime(t) { TOD.t = t; TOD.vel = 0; },
  setYaw(y) { CAM.yaw = y; CAM.yawV = 0; },
  pointAt(nx, ny) { pointer.nx = nx; pointer.ny = ny; pointer.active = true; },
  tap(nx, ny) { interact(pick(nx, ny, { kind: 'sky', point: new V3(), dir: new V3() })); },
  info() { return { t: TOD.t, night: env.night, dpr: Q.dpr, stage: perf.stage, grass: grass.geometry.instanceCount, flowers: allFlowers.length, mushrooms: mushrooms.length, trees: nearTrees.length + farTrees.length }; },
  pickKind(nx, ny) { const h = pick(nx, ny, { kind: 'sky', point: new V3(), dir: new V3() }); return h.kind; },
  pause() { running = false; },
  resume() { if (!running) { running = true; clock.last = performance.now(); requestAnimationFrame(loop); } },
  step(n = 1, ms = 1000 / 60) { for (let i = 0; i < n; i++) frame(clock.last + ms); },
  snap() { frame(clock.last + 1000 / 60); return canvas.toDataURL('image/png'); },
};

(async () => {
  updateTime(0); updateCamera(0); camera.updateMatrixWorld();
  try { await renderer.compileAsync(scene, camera); } catch (e) { /* compile lazily */ }
  clock.last = performance.now();
  requestAnimationFrame((t) => {
    loop(t);
    requestAnimationFrame(() => document.getElementById('veil').classList.add('gone'));
  });
})();
</script>
</body>
</html>

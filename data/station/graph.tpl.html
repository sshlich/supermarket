<title>Station Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: one-screen tool. Toolbar on top, canvas fills the middle, inspector on the right (below the canvas on a phone). */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1b2430; --mute: #66727f; --line: #d5dae0;
  --edge: rgba(40, 60, 90, .16); --hot: #d6336c; --focus: #1f6feb;
  --lightness: 42%;
  --display: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --panel: #141b23; --ink: #dde4ea; --mute: #8593a0; --line: #263341;
    --edge: rgba(150, 180, 220, .14); --hot: #ff6b9a; --focus: #58a6ff; --lightness: 64%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --panel: #141b23; --ink: #dde4ea; --mute: #8593a0; --line: #263341;
  --edge: rgba(150, 180, 220, .14); --hot: #ff6b9a; --focus: #58a6ff; --lightness: 64%; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 13px; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
header { padding: 10px 16px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
.row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; min-width: 0; }
h1 { margin: 0; font: 600 16px var(--display); letter-spacing: .02em; text-transform: uppercase; }
.stats { color: var(--mute); font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
input[type=search], select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; font: inherit; min-width: 0; }
input[type=search] { width: 200px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; user-select: none; background: transparent; color: var(--ink); font: inherit; font-size: 12px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--c); }
.chip[aria-pressed=false] { opacity: .38; }
.chip:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
label.k { display: inline-flex; gap: 4px; align-items: center; color: var(--mute); cursor: pointer; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; border-radius: 3px; font-size: 12px; max-width: 240px; display: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px; min-height: 0; }
aside h2 { margin: 0 0 2px; font: 600 15px var(--display); text-wrap: balance; }
.id { font: 11px var(--mono); color: var(--mute); word-break: break-all; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0; color: var(--mute); font-size: 12px; }
.facts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.group { margin-top: 12px; }
.group h3 { margin: 0 0 4px; font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
.group button { display: flex; width: 100%; align-items: baseline; gap: 6px; text-align: left; background: none; border: 0; padding: 3px 0; color: var(--ink); font: inherit; cursor: pointer; border-bottom: 1px dotted var(--line); }
.group button small { color: var(--mute); font: 11px var(--mono); margin-left: auto; padding-left: 6px; white-space: nowrap; }
.hint { color: var(--mute); line-height: 1.5; }
.hint p { margin: 0 0 8px; }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 40%; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
<div id="app">
  <header>
    <div class="row">
      <h1>Station data</h1>
      <span class="stats" id="stats"></span>
      <input type="search" id="q" placeholder="Find by name or id" aria-label="Find a node">
      <select id="ph" aria-label="Show up to phase">
        <option value="9">All phases</option><option value="1">Phase 1</option><option value="2">up to phase 2</option><option value="3">up to phase 3</option>
      </select>
      <label class="k"><input type="checkbox" id="k_produces"> machine → product</label>
      <label class="k"><input type="checkbox" id="k_serves"> item → need</label>
      <label class="k"><input type="checkbox" id="k_sells"> residents</label>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main>
    <div id="stage"><canvas id="cv"></canvas><div id="tip"></div></div>
    <aside id="side"></aside>
  </main>
</div>
<script>
const D = /*DATA*/null;
const GROUPS = [
  ['core', 'Core', 'item', 20], ['fab', 'Fab', 'item', 75], ['food', 'Food', 'item', 135], ['life', 'Life', 'item', 175],
  ['lux', 'Luxury', 'item', 300], ['mach', 'Mach items', 'item', 40], ['med', 'Medicine', 'item', 345], ['tech', 'Tech', 'item', 255], ['fit', 'Fittings', 'item', 100],
  ['machine', 'Machines', 'machine', 0], ['disc', 'Discs', 'disc', 0], ['program', 'Programs', 'program', 0],
  ['upgrade', 'Upgrades', 'upgrade', 0], ['need', 'Needs', 'need', 0], ['resident', 'Residents', 'resident', 0]
]
const hue = {}, gof = n => n.type === 'item' ? n.dom : n.type
GROUPS.forEach(g => hue[g[0]] = g[0] === 'machine' ? 'g' : g[3])
const on = new Set(GROUPS.map(g => g[0]))
const kindsOn = new Set(['make', 'recipe', 'grants', 'requires', 'runs on'])
let phMax = 9, sel = null, hot = null, found = new Set()

const byId = new Map(D.nodes.map(n => [n.id, n]))
const out = {}, inn = {}
D.edges.forEach(e => { (out[e.s] ??= []).push(e); (inn[e.t] ??= []).push(e); e.source = e.s; e.target = e.t })
const rad = n => 2.4 + Math.sqrt(n.deg) * 1.1

const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), tip = document.getElementById('tip')
let W = 0, H = 0, T = d3.zoomIdentity, pal = {}
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim()
function refreshPalette() {
  const L = css('--lightness')
  GROUPS.forEach(g => { pal[g[0]] = g[0] === 'machine' ? `hsl(0 0% ${parseInt(L) + 22}%)` : `hsl(${g[3]} ${g[2] === 'item' ? 62 : 72}% ${L})` })
  pal.edge = css('--edge'); pal.hot = css('--hot'); pal.ink = css('--ink'); pal.focus = css('--focus')
  document.querySelectorAll('.chip').forEach(c => c.style.setProperty('--c', pal[c.dataset.g]))
}

// layout: one force run on every node, so filters never move anything
const sim = d3.forceSimulation(D.nodes)
  .force('link', d3.forceLink(D.edges).id(d => d.id).distance(26).strength(.35))
  .force('charge', d3.forceManyBody().strength(-34).distanceMax(220))
  .force('x', d3.forceX().strength(.035)).force('y', d3.forceY().strength(.035))
  .force('hit', d3.forceCollide().radius(d => rad(d) + 1)).stop()
for (let i = 0; i < 380; i++) sim.tick()

const visible = n => on.has(gof(n)) && (n.ph === undefined || n.ph === 0 || n.ph <= phMax)
function closure(id, dir) {
  const seen = new Set([id]), q = [id], adj = dir > 0 ? out : inn
  while (q.length) for (const e of adj[q.pop()] ?? []) {
    if (!kindsOn.has(e.kind)) continue
    const o = dir > 0 ? e.t : e.s
    if (!seen.has(o) && visible(byId.get(o))) { seen.add(o); q.push(o) }
  }
  return seen
}
let up = new Set(), down = new Set()

function draw() {
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
  ctx.clearRect(0, 0, W, H)
  ctx.translate(T.x, T.y); ctx.scale(T.k, T.k)
  const focus = sel !== null
  ctx.lineWidth = 1 / T.k
  for (const e of D.edges) {
    if (!kindsOn.has(e.kind)) continue
    const a = e.source, b = e.target
    if (!visible(a) || !visible(b)) continue
    const inUp = focus && up.has(a.id) && up.has(b.id), inDown = focus && down.has(a.id) && down.has(b.id)
    if (focus && !inUp && !inDown) { ctx.strokeStyle = pal.edge; ctx.globalAlpha = .18 }
    else { ctx.strokeStyle = focus ? (inUp ? pal.focus : pal.hot) : pal.edge; ctx.globalAlpha = focus ? .9 : 1; if (focus) ctx.lineWidth = 1.3 / T.k }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.lineWidth = 1 / T.k
  }
  for (const n of D.nodes) {
    if (!visible(n)) continue
    const lit = !focus || up.has(n.id) || down.has(n.id)
    ctx.globalAlpha = found.size && !found.has(n.id) ? .12 : lit ? 1 : .15
    ctx.fillStyle = pal[gof(n)]
    ctx.beginPath()
    if (n.type === 'item') ctx.arc(n.x, n.y, rad(n), 0, 7)
    else { const r = rad(n) * 1.15; ctx.rect(n.x - r, n.y - r, 2 * r, 2 * r) }
    ctx.fill()
    if (n.contra) { ctx.strokeStyle = pal.hot; ctx.lineWidth = 1.2 / T.k; ctx.stroke() }
    if (n.id === sel) { ctx.globalAlpha = 1; ctx.strokeStyle = pal.ink; ctx.lineWidth = 2 / T.k; ctx.beginPath(); ctx.arc(n.x, n.y, rad(n) + 3, 0, 7); ctx.stroke() }
  }
  ctx.globalAlpha = 1
  if (T.k > 2.2) {
    ctx.fillStyle = pal.ink; ctx.font = `${10 / T.k * 1.1}px system-ui`
    for (const n of D.nodes) if (visible(n) && (!focus || up.has(n.id) || down.has(n.id)) && rad(n) * T.k > 4) ctx.fillText(n.name, n.x + rad(n) + 2, n.y + 3)
  }
}
function resize() {
  const r = cv.parentElement.getBoundingClientRect(); W = r.width; H = r.height
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio
  draw()
}
const zoom = d3.zoom().scaleExtent([.2, 12]).on('zoom', ev => { T = ev.transform; draw() })
d3.select(cv).call(zoom)
function fit() {
  const v = D.nodes.filter(visible); if (!v.length) return
  const x0 = d3.min(v, n => n.x), x1 = d3.max(v, n => n.x), y0 = d3.min(v, n => n.y), y1 = d3.max(v, n => n.y)
  const k = Math.min(W / (x1 - x0 + 60), H / (y1 - y0 + 60), 4)
  d3.select(cv).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k))
}
const world = (px, py) => T.invert([px, py])
function pick(px, py) {
  const [x, y] = world(px, py); let best = null, bd = 1e9
  for (const n of D.nodes) { if (!visible(n)) continue; const d = Math.hypot(n.x - x, n.y - y); if (d < rad(n) + 4 / T.k && d < bd) { best = n; bd = d } }
  return best
}
cv.addEventListener('mousemove', ev => {
  const r = cv.getBoundingClientRect(), n = pick(ev.clientX - r.left, ev.clientY - r.top)
  if (n) { tip.style.display = 'block'; tip.style.left = Math.min(ev.clientX - r.left + 12, W - 250) + 'px'; tip.style.top = ev.clientY - r.top + 12 + 'px'; tip.textContent = `${n.name} · ${n.type}${n.tier ? ' · tier ' + n.tier : ''}${n.value != null ? ' · worth ' + n.value : ''}`; cv.style.cursor = 'pointer' }
  else { tip.style.display = 'none'; cv.style.cursor = 'grab' }
})
cv.addEventListener('mouseleave', () => tip.style.display = 'none')
cv.addEventListener('click', ev => { const r = cv.getBoundingClientRect(); select(pick(ev.clientX - r.left, ev.clientY - r.top)?.id ?? null) })

function select(id) {
  sel = id
  if (id) { up = closure(id, -1); down = closure(id, 1) } else { up = new Set(); down = new Set() }
  inspect(); draw()
}
function list(title, edges, side) {
  if (!edges.length) return ''
  const uniq = [...new Map(edges.map(e => [byId.get(e[side]).id + e.kind, e])).values()]
  return `<div class="group"><h3>${title} · ${uniq.length}</h3>${uniq.slice(0, 40).map(e => `<button data-id="${e[side]}">${esc(byId.get(e[side]).name)}<small>${e.m ? e.m.replace('mach_', '') : e.kind}</small></button>`).join('')}${uniq.length > 40 ? `<div class="hint">and ${uniq.length - 40} more</div>` : ''}</div>`
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
function inspect() {
  const side = document.getElementById('side')
  if (!sel) {
    const iso = D.nodes.filter(n => !n.deg)
    side.innerHTML = `<div class="hint"><p>Click a node to trace it. Blue is everything it depends on, pink is everything it leads to.</p>
      <p>Circles are items, squares are machines, discs, programs, upgrades, needs and residents. A pink ring marks contraband. Size follows the number of links.</p>
      <p>Scroll to zoom, drag to pan. Phase 1 shows only what the opening game can reach.</p>
      <p><b>${iso.length}</b> nodes have no links at all${iso.length ? ': ' + iso.slice(0, 8).map(n => esc(n.name)).join(', ') + (iso.length > 8 ? '…' : '') : ''}.</p></div>`
    return
  }
  const n = byId.get(sel)
  side.innerHTML = `<h2>${esc(n.name)}</h2><div class="id">${n.id}</div>
    <div class="facts"><span>${n.type}${n.dom ? ' · ' + n.dom : ''}</span>${n.tier ? `<span>tier <b>${n.tier}</b></span>` : ''}${n.value != null ? `<span>worth <b>${n.value}</b></span>` : ''}${n.ph ? `<span>phase <b>${n.ph}</b></span>` : ''}${n.cost ? `<span>cost <b>${n.cost}</b></span>` : ''}<span>reaches <b>${down.size - 1}</b></span><span>needs <b>${up.size - 1}</b></span></div>
    ${list('Made from / unlocked by', (inn[sel] ?? []).filter(e => kindsOn.has(e.kind)), 's')}${list('Leads to', (out[sel] ?? []).filter(e => kindsOn.has(e.kind)), 't')}`
  side.querySelectorAll('button').forEach(b => b.onclick = () => { select(b.dataset.id); focusOn(b.dataset.id) })
}
function focusOn(id) {
  const n = byId.get(id); if (!n) return
  d3.select(cv).transition().duration(350).call(zoom.transform, d3.zoomIdentity.translate(W / 2 - n.x * Math.max(T.k, 2.5), H / 2 - n.y * Math.max(T.k, 2.5)).scale(Math.max(T.k, 2.5)))
}

// controls
const chips = document.getElementById('chips')
GROUPS.forEach(g => {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.g = g[0]; b.setAttribute('aria-pressed', 'true')
  b.innerHTML = `<i></i>${g[1]}`; b.onclick = () => { on.has(g[0]) ? on.delete(g[0]) : on.add(g[0]); b.setAttribute('aria-pressed', on.has(g[0])); refresh() }
  chips.appendChild(b)
})
const bind = (id, kinds) => document.getElementById(id).onchange = e => { kinds.forEach(k => e.target.checked ? kindsOn.add(k) : kindsOn.delete(k)); refresh() }
bind('k_produces', ['produces']); bind('k_serves', ['serves']); bind('k_sells', ['sells', 'buys'])
document.getElementById('ph').onchange = e => { phMax = +e.target.value; refresh() }
document.getElementById('q').oninput = e => {
  const s = e.target.value.trim().toLowerCase()
  found = new Set(s ? D.nodes.filter(n => visible(n) && (n.name.toLowerCase().includes(s) || n.id.includes(s))).map(n => n.id) : [])
  draw()
}
document.getElementById('q').onkeydown = e => { if (e.key === 'Enter' && found.size) { const id = [...found][0]; select(id); focusOn(id) } }
function refresh() { if (sel && !visible(byId.get(sel))) sel = null; select(sel) }

const kinds = {}; D.edges.forEach(e => kinds[e.kind] = (kinds[e.kind] ?? 0) + 1)
document.getElementById('stats').textContent = `${D.nodes.length} nodes · ${D.edges.length} links · ${D.nodes.filter(n => n.type === 'item').length} items`
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { refreshPalette(); draw() })
new MutationObserver(() => { refreshPalette(); draw() }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] })
addEventListener('resize', resize)
refreshPalette(); inspect(); resize(); fit()
</script>
